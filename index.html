<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Club der Fettsäcke</title>
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Fettsäcke">
<link rel="preload" href="fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Schrift lokal (SIL OFL, siehe fonts/OFL.txt) – kein Request an Google */
@font-face{font-family:'Schibsted Grotesk';font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/schibsted-grotesk-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  color-scheme:dark;
  --bg:#0b0b0c;--surface:#141415;--surface-2:#1c1c1e;--surface-3:#262628;--done:#ff6b2c;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --text:#f5f5f4;--text-2:#b4b4b0;--muted:#86867f;
  --accent:#ff6b2c;--accent-hover:#ff7f47;--accent-ink:#1a0800;--accent-tint:rgba(255,107,44,.12);
  --ch:#e2b04f;--ch-ink:#1f1500;--ch-tint:rgba(226,176,79,.16);
  --good:#8fd08a;--bad:#f2937f;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;
  --r:14px;--r-sm:10px;--r-xs:6px;
  --pad:16px;--gap:12px;--wrap:16px;--side:232px;
  --font:'Schibsted Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (max-width:380px){:root{--pad:12px;--wrap:12px}}
@media (min-width:640px){:root{--pad:20px;--gap:16px;--wrap:24px}}
@media (min-width:1025px){:root{--wrap:32px}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:400 clamp(15px,14.2px + .2vw,16px)/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}.t2{color:var(--text-2)}.small{font-size:13px}.ok{color:var(--good)}.bad{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:8px}
.loading{padding:24px 0;color:var(--muted)}
/* Tabellenziffern nur dort, wo Zahlen untereinander stehen oder sich ändern */
.tnum,.rk .pos,.rk .pts b,.rk .br,table.t td,.cd,.rankline .big{font-variant-numeric:tabular-nums}
.pp,::marker{font-variant-numeric:normal} /* Komma/Punkt schmal halten, Ziffern bleiben tabellarisch */

/* ---------- Gerüst ---------- */
.wrap{padding:12px var(--wrap) calc(84px + env(safe-area-inset-bottom));padding-left:max(var(--wrap),env(safe-area-inset-left));padding-right:max(var(--wrap),env(safe-area-inset-right))}
@media (min-width:640px){.wrap{max-width:calc(760px + 2 * var(--wrap));margin-inline:auto;padding-top:20px}}
@media (min-width:1025px){
  .wrap{max-width:calc(1200px + 2 * var(--wrap));margin:0;padding:28px var(--wrap) 48px}
  body.has-nav .wrap{margin-left:var(--side)}
}
.view{display:grid;gap:var(--gap);align-content:start;min-width:0}
.split{display:grid;gap:var(--gap);align-items:start;min-width:0}
@media (min-width:1025px){.split{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}.split.rank{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}.login{grid-template-columns:minmax(0,400px) minmax(0,1fr);align-items:start}.narrow{max-width:520px}}
.only-wide{display:none}
@media (min-width:1025px){.only-wide{display:block}}

.apphead{display:flex;align-items:center;gap:12px;padding:4px 0 var(--gap)}
.logo{font-size:19px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.sub{margin-top:2px;font-size:13px;color:var(--text-2)}
.avatar{margin-left:auto;width:36px;height:36px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:800;cursor:pointer}
.ptitle{display:none}
@media (min-width:1025px){
  body.has-nav .apphead{display:none}
  body.has-nav .ptitle{display:block;margin-bottom:20px;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-bottom:var(--gap);padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);font-size:12px;color:var(--muted)}
.banner b{color:var(--accent);font-weight:600}
.banner input{padding:2px 6px;border:1px solid var(--line-2);border-radius:var(--r-xs);background:var(--surface-2);font-size:13px}

/* ---------- Karten ---------- */
.card{min-width:0;padding:var(--pad);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.card>*+*{margin-top:12px}
.card h3,.sheet h3{margin-top:24px;font-size:14px;font-weight:700;line-height:1.4}
.card h3+*,.sheet h3+*{margin-top:8px}
.hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.hd h2,.sheet h2{font-size:13px;font-weight:600;letter-spacing:.01em;line-height:1.35;color:var(--text-2)}
.sheet h2{font-size:17px;color:var(--text)}
.aside{font-size:13px;color:var(--text-2);white-space:nowrap}
.aside b{color:var(--text);font-weight:700}
.sep{padding-top:12px;border-top:1px solid var(--line)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--text-2)}
.card>label.f+*,.sheet>label.f+*{margin-top:6px}
.chtext{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.25}

/* ---------- Bedienelemente ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid transparent;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);font-weight:700;white-space:nowrap;cursor:pointer;transition:background-color .12s,border-color .12s}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--surface-2);border-color:var(--line-2);color:var(--text)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.full{display:flex;width:100%}
.link{display:inline-flex;align-items:center;min-height:32px;padding:0;border:0;background:none;color:var(--text-2);font-size:13px;font-weight:500;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;cursor:pointer}
.link:hover{color:var(--text);text-decoration-color:currentColor}
.iconbtn{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;padding:0;border:0;border-radius:var(--r-xs);background:transparent;color:var(--text-2);cursor:pointer}
.iconbtn:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.iconbtn:disabled{opacity:.35;cursor:default}
.inp{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);outline:none;transition:border-color .12s,box-shadow .12s}
.inp.auto{width:auto}
.inp:disabled{color:var(--muted);background:transparent;border-style:dashed}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.inp::placeholder{color:var(--muted);opacity:1}
select.inp{appearance:auto;padding-right:8px}
.tag{display:inline-flex;align-items:center;min-height:22px;padding:0 6px;border:1px solid var(--line-2);border-radius:var(--r-xs);font-size:12px;color:var(--text-2);white-space:nowrap}
.tag.ok{color:var(--good);border-color:rgba(143,208,138,.4)}
.tag.bad{color:var(--bad);border-color:rgba(242,147,127,.45)}
.entry{flex-wrap:wrap}
.entry .inp.grow{flex:1 1 110px}
.entry .btn{flex:1 0 auto}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wnav b{font-size:13px;font-weight:500;color:var(--text-2);text-align:center}

/* ---------- Heute ---------- */
.dash{display:grid;gap:var(--gap);align-items:start}
.dash .col{display:grid;gap:var(--gap);align-content:start;min-width:0}
@media (min-width:640px){
  .dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a c" "b b"}
  .col.a{grid-area:a}.col.b{grid-area:b}.col.c{grid-area:c}
}
@media (min-width:640px) and (orientation:landscape) and (max-height:520px){.dash{grid-template-areas:"b b" "a c"}}
@media (min-width:1025px){.dash{grid-template-columns:minmax(230px,.95fr) minmax(400px,1.5fr) minmax(230px,.95fr);grid-template-areas:"a b c"}}
.card.due{border-color:rgba(255,107,44,.5);background:linear-gradient(var(--accent-tint),var(--accent-tint)),var(--surface)}
.card.due .inp:focus{border-color:var(--accent)}
.when{font-size:14px;color:var(--text-2)}
.when b{color:var(--text)}
.kg{font-size:20px;font-weight:700}
.rankline{display:flex;align-items:baseline;gap:8px}
.rankline .big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{text-align:right;white-space:nowrap;font-weight:600}
.streak{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px;color:var(--text-2)}
.streak .ico{width:16px;height:16px}
.streak b{color:var(--text);font-weight:700}
.streak .m:not(:last-child)::after{content:" ·";color:var(--muted)}

.lb{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.lb .r{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:4px 10px;font-size:14px}
.lb .n{color:var(--muted);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.lb .nm{overflow:hidden;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.lb .v{font-weight:700;font-variant-numeric:tabular-nums}
.lb .tr{grid-column:2/4;height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.lb .tr i{display:block;height:100%;border-radius:99px}
.lb .me .nm::after{content:" · du";color:var(--muted);font-weight:500}
.gap{font-size:14px;color:var(--text-2)}
.gap b{color:var(--text)}
/* Gewohnheiten-Raster: auf schmalen Karten Name über der Zeile, ab 460px daneben */
.hgrid{container-type:inline-size}
.hrow{display:grid;gap:6px}
.hrow+.hrow{margin-top:10px}
.hhead .hname{display:none}
.hname{overflow:hidden;font-size:14px;font-weight:500;line-height:1.3;color:var(--text);text-overflow:ellipsis;white-space:nowrap}
.hcells{display:grid;grid-template-columns:repeat(7,minmax(36px,1fr));gap:6px}
.dh{display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.25;color:var(--muted)}
.dh b{font-size:13px;font-weight:600;color:var(--text-2)}
.dh.today,.dh.today b{color:var(--accent);font-weight:700}
.hgrid.focus .dh.today,.hgrid.focus .dh.today b{color:var(--accent)}
.hc{display:grid;place-items:center;height:40px;padding:0;border:1px solid transparent;border-radius:var(--r-sm);background:var(--surface-2);color:var(--accent-ink);cursor:pointer;transition:background-color .15s,border-color .15s,transform .15s}
.hc:active:not(:disabled){transform:scale(.92)}
.hc:hover:not(:disabled):not(.on){background:var(--surface-3)}
.hc .ck{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s}
.hc.on{background:var(--accent);border-color:var(--accent)}
.hc.on .ck{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.hc.on .ck{opacity:1}
.hc.lock{opacity:.45;cursor:default}
.hc.off{background:transparent;border-color:rgba(255,255,255,.045);cursor:default}
.hgrid.focus .hc.td{border-color:rgba(255,107,44,.6);box-shadow:0 0 0 3px var(--accent-tint)}
.hgrid.focus .hc.td.on{background:var(--accent);color:var(--accent-ink)}
.hrow.ch{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hrow.ch .hname{color:var(--text-2)}
.hrow.ch .hname b{color:var(--ch);font-weight:700}
.hrow.ch .hc{color:var(--ch)}
.hrow.ch .hc.on{background:var(--ch);border-color:var(--ch);color:var(--ch-ink)}
.hgrid.focus .hrow.ch .hc.td.on{background:var(--ch);border-color:var(--ch);color:var(--ch-ink)}
@container (min-width:460px){
  .hrow{grid-template-columns:minmax(0,1fr) minmax(304px,2.2fr);align-items:center;gap:10px}
  .hhead .hname{display:block}
  .hrow+.hrow{margin-top:6px}
  .hrow.ch{margin-top:12px;padding-top:12px}
}
.bar{height:6px;overflow:hidden;border-radius:99px;background:var(--surface-3)}
.bar i{display:block;height:100%;background:var(--text-2);transition:width .15s}
.bar.done i{background:var(--good)}

/* ---------- Ranking ---------- */
.seg{display:flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
.seg button{flex:1;min-height:34px;border:0;border-radius:var(--r-xs);font-size:14px;background:transparent;color:var(--text-2);font-weight:600;cursor:pointer;transition:background-color .12s,color .12s}
.seg button.on{background:var(--surface-3);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.4)}
@media (min-width:1025px){.seg{max-width:440px}}
.rlist{container-type:inline-size}
.rk{display:grid;grid-template-columns:24px minmax(0,1fr) auto;grid-template-areas:"pos who pts" "pos br pts";align-items:start;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.rk .pos{grid-area:pos;font-size:15px;font-weight:700;line-height:1.5;color:var(--muted);text-align:center}
.rk .who{grid-area:who;min-width:0}
.rk .br{grid-area:br;font-size:13px;color:var(--text-2)}
.rk .br{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:4px}
.rk .br span::before{content:attr(data-l) " ";color:var(--muted)}
.rk .pts{grid-area:pts;text-align:right}
.rk .pts b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.rk .pts small{display:block;margin-top:2px;font-size:12px;color:var(--muted);white-space:nowrap}
.rk .nm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:700}
.rk.head{display:none}
.rk.head .pos,.rk.head .who,.rk.head .pts{display:none}
.rk.head .br{font-size:12px;color:var(--muted)}
.rk.me{margin-inline:calc(var(--pad) * -1);padding-inline:var(--pad);background:rgba(255,255,255,.035);box-shadow:inset 2px 0 0 var(--accent)}
.rk.lead .pos,.rk.lead .pts b{color:var(--accent)}
@container (min-width:540px){
  .rk{grid-template-columns:28px minmax(130px,1fr) repeat(var(--n),minmax(44px,76px)) 76px;grid-template-areas:none;align-items:center;column-gap:8px}
  .rk .pos,.rk .who,.rk .br,.rk .pts{grid-area:auto}
  .rk .br{display:contents}
  .rk .br span{text-align:right}
  .rk .br span::before{content:none}
  .rk.head{display:grid;grid-template-areas:none;border-bottom:1px solid var(--line)}
  .rk.head+.rk{border-top:0}
  .rk.head .pos,.rk.head .who,.rk.head .pts{display:block;font-size:12px;font-weight:600;color:var(--muted)}
  .rk.head .pts{text-align:right}
  .rk.head .br span{line-height:1.2;hyphens:manual}
}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin-top:2px;font-size:12px;color:var(--muted)}
.meta .still{color:var(--bad)}
.meta .stk{display:inline-flex;align-items:center;gap:2px;color:var(--text-2)}
.meta .stk .ico{width:14px;height:14px}
.meta .ms{padding:0 5px;border:1px solid var(--line-2);border-radius:var(--r-xs);line-height:18px;color:var(--text-2)}
.dot{display:inline-block;width:10px;height:10px;flex:none;border-radius:50%}

/* ---------- Listen, Tabellen, Diagramm ---------- */
.task{padding-top:12px;border-top:1px solid var(--line)}
.task .tt{font-weight:700}
.task .who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px}
.row.top{align-items:flex-start}
.wk{flex:none;width:32px;font-size:13px;font-weight:700;line-height:22px;color:var(--muted)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{padding-left:0;text-align:left}
table.t th:last-child,table.t td:last-child{padding-right:0}
table.t th{font-weight:600;color:var(--muted)}
table.t tr.sum td{border-bottom:0;font-weight:700}
.chart{position:relative;min-height:200px}
.chart svg{display:block;touch-action:pan-y}
.chart text{font-family:var(--font);font-size:12px;fill:var(--muted)}
.chart text.nm{font-weight:700;fill:var(--text-2)}
.chart .gl{stroke:var(--line)}
.chart .zero{stroke:#5d584c}
.chart .xh{stroke:var(--muted);stroke-dasharray:3 3}
.tip{position:absolute;top:8px;z-index:5;min-width:130px;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#0d0c0a;font-size:12px;pointer-events:none}
.tip .tr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.rules{max-width:72ch}
.rules p,.rules li{color:var(--text-2)}
.rules b{color:var(--text);font-weight:600}
.rules ul{padding-left:20px}
.rules li+li{margin-top:4px}

/* ---------- Navigation: unten (Handy/Tablet), links (Desktop) ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:4px max(4px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left));background:rgba(11,11,12,.82);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--line)}
.tabs .brand,.tabs .prof{display:none}
.tabs .in{display:flex;max-width:760px;margin:0 auto}
.tabs .in button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 2px 4px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:color .12s,background-color .12s}
.tabs .in button .ico{width:22px;height:22px}
.tabs .in button.on{color:var(--accent)}
@media (orientation:landscape) and (max-height:520px){
  .tabs{padding-top:2px;padding-bottom:calc(2px + env(safe-area-inset-bottom))}
  .tabs .in button{flex-direction:row;justify-content:center;gap:6px;min-height:40px;font-size:12px}
  .tabs .in button .ico{width:18px;height:18px}
  .wrap{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
}
@media (min-width:1025px){
  .tabs{top:0;right:auto;width:var(--side);display:flex;flex-direction:column;gap:24px;padding:28px 12px 20px;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;border-top:0;border-right:1px solid var(--line)}

/* =====================================================================
   PUNKTE-LOGIK
   ===================================================================== */

function chTarget(ch) { return ch?.kind === 'daily' ? 7 : clamp(ch?.target || 1, 1, 7); }

  const save = () => LS.setItem(KEY, JSON.stringify(mine));
  const BOTS = [
    { uid: 'bot-siggi', name: 'Siggi', start: 104.6, trend: 0.75, disc: 0.75, habits: ['10.000 Schritte', 'Kein Fast Food', 'Kein Zucker nach 18 Uhr'], joined: 1, idle: 2 / 24 },
    { uid: 'bot-julian', name: 'Julian', start: 91.2, trend: 0.55, disc: 0.6, habits: ['Training (min. 45 Min)', 'Kein Alkohol', '2 L Wasser'], joined: 2, idle: 3 },
  ];
  const WEEKLY_TXT = [{ text: 'Treppe statt Aufzug', kind: 'daily' }, { text: '2× Sport (min. 45 Min)', kind: 'count', target: 2 }, { text: 'Kein Lieferdienst', kind: 'daily' }, { text: '1× 5 km laufen', kind: 'count', target: 1 }, { text: '20 Min spazieren', kind: 'daily' }];
  const TEAM_TXT = { 2: { text: '200.000 Schritte gemeinsam', kind: 'sum', target: 200000, unit: 'Schritte' }, 3: { text: '300.000 Schritte gemeinsam', kind: 'sum', target: 300000, unit: 'Schritte' }, 5: { text: '15× 30 Min Sport gemeinsam', kind: 'count', target: 15, unit: '' } };
  function seed() {
    const S = { players: {}, weighins: {}, habitlogs: {}, weekly: {}, weeklyDone: {}, tasks: {}, taskDone: {}, teamgoals: {}, teamlogs: {} };
    const t = now(), today = dayIdx(t), lc = lastClosedSlot(), os = openSlot();
    for (const b of BOTS) {
      S.players[b.uid] = { name: b.name, habits: b.habits, joinedSlot: 0, joinedAt: b.joined, lastActive: t.getTime() - b.idle * DAY };
      const r = rng(b.uid); let kg = b.start;
      for (let k = 0; k <= CONFIG.weeks; k++) {
        const due = k <= lc || (os === k && b.uid === 'bot-siggi');
        if (!due) break;
        if (k > 0) kg += -b.start * b.trend / 100 + (r() - 0.45) * 0.9;
        if (k > 0 && r() < 0.07) continue; // verpasst
        S.weighins[b.uid + '_' + k] = { uid: b.uid, slot: k, lossPct: Math.round((b.start - kg) / b.start * 10000) / 100 };
      }
      for (let d = 0; d < today && d < CONFIG.weeks * 7; d++) {
        const rr = rng(b.uid + d);
        S.habitlogs[b.uid + '_' + d] = { uid: b.uid, day: d, done: [rr() < b.disc, rr() < b.disc - .1, rr() < b.disc + .1, rr() < b.disc - .2] };
      }
    }
    for (let w = 1; w <= Math.min(curWeek(), CONFIG.weeks); w++) {
      if (mine.weekly[w]) continue;
      if (w === curWeek() && w > 1 && dayIdx() === 7 * (w - 1)) continue; // Montag: der Wochenletzte ist dran
      S.weekly[w] = { ...WEEKLY_TXT[(w - 1) % WEEKLY_TXT.length], setBy: w % 2 ? 'bot-julian' : 'bot-siggi', setByName: w % 2 ? 'Julian' : 'Siggi' };
    }
    for (const [w, g] of Object.entries(TEAM_TXT)) if (+w <= curWeek() && !mine.teamgoals[w]) S.teamgoals[w] = { ...g, week: +w, setBy: 'bot-julian', setByName: 'Julian' };
    for (const b of BOTS) for (let d = 0; d < today && d < CONFIG.weeks * 7; d++) {
      const w = weekOfDay(d), g = S.teamgoals[w] || mine.teamgoals[w]; if (!g) continue;
      const rr = rng(b.uid + 't' + d); if (rr() < .15) continue;
      S.teamlogs[b.uid + '_' + d] = { uid: b.uid, day: d, week: w, value: g.kind === 'count' ? 1 : Math.round((7000 + rr() * 7000) / 100) * 100 };
    }
    const ce = curWeek() >= 1 ? etappeOf(Math.min(curWeek(), CONFIG.weeks)) : 0;
    for (let e = 1; e <= ce; e++) {
      const ta = 'e' + e + '_bot-siggi', tb = 'e' + e + '_bot-julian';
      S.tasks[ta] = { etappe: e, text: '2× 5 km laufen', createdBy: 'bot-siggi', createdByName: 'Siggi', ts: 1 };
      S.taskDone[ta + '_bot-siggi'] = { uid: 'bot-siggi', taskId: ta, confirmedBy: 'bot-julian', confirmedByName: 'Julian' };
      if (e < ce || dayIdx() % 28 > 10) {
        S.tasks[tb] = { etappe: e, text: '1 Stunde schwimmen', createdBy: 'bot-julian', createdByName: 'Julian', ts: 2 };
        S.taskDone[tb + '_bot-julian'] = { uid: 'bot-julian', taskId: tb, confirmedBy: null };
      }
    }
    return S;
  }
  function state() {
    const s = seed();
    const S = { ...emptyState(), ready: true, synced: true, authed: true, me: ME };
    S.member = !!mine.player;
    for (const k of ['players', 'weighins', 'habitlogs', 'weekly', 'weeklyDone', 'tasks', 'taskDone', 'teamgoals', 'teamlogs']) S[k] = { ...s[k], ...(k === 'players' ? {} : mine[k]) };
    if (mine.player) S.players[ME] = mine.player;
    S.myWeights = { ...mine.myWeights };
    return S;
  }
  const commit = () => { if (mine.player) mine.player.lastActive = now().getTime(); save(); emit(state()); };
  setTimeout(() => emit(state()));
  return {
    demo: true, refresh: () => emit(state()),
    signIn() { }, signOut() { },
    reset() { LS.removeItem(KEY); mine = blank(); commit(); },
    async register(d) { mine.player = { name: d.name, habits: d.habits, joinedSlot: d.joinedSlot, joinedAt: Date.now(), invite: 'DEMO' }; commit(); },
    async updatePlayer(d) { Object.assign(mine.player, d); commit(); },
    async saveWeigh(slot, kg, lossPct) { mine.weighins[ME + '_' + slot] = { uid: ME, slot, lossPct }; mine.myWeights[slot] = kg; commit(); },
    async setHabit(day, done) { mine.habitlogs[ME + '_' + day] = { uid: ME, day, done }; commit(); },
    async setWeekly(w, text, kind, target) { mine.weekly[w] = { text, kind, target, setBy: ME, setByName: mine.player.name }; commit(); },
    async addTask(e, text) { const id = 'e' + e + '_' + ME; mine.tasks[id] = { etappe: e, text, createdBy: ME, createdByName: mine.player.name, ts: Date.now() }; commit(); },
    async deleteTask(id) { delete mine.tasks[id]; for (const k of Object.keys(mine.taskDone)) if (k.startsWith(id + '_')) delete mine.taskDone[k]; commit(); },
    async markTask(id, on) {
      const k = id + '_' + ME;
      if (on) { mine.taskDone[k] = { uid: ME, taskId: id, confirmedBy: null }; setTimeout(() => { if (mine.taskDone[k]) { mine.taskDone[k].confirmedBy = 'bot-julian'; mine.taskDone[k].confirmedByName = 'Julian'; commit(); toast('Julian hat deine Aufgabe bestätigt.'); } }, 2500); }
      else delete mine.taskDone[k];
      commit();
    },
    async confirmTask(tdId) {
      const td = mine.taskDone[tdId] || null;
      if (td) { td.confirmedBy = ME; td.confirmedByName = mine.player.name; }
      else { // Bot-Eintrag: als eigene Kopie übernehmen
        const s = seed().taskDone[tdId]; if (s) mine.taskDone[tdId] = { ...s, confirmedBy: ME, confirmedByName: mine.player.name };
      }
      commit();
    },
    async setTeamGoal(w, d) { mine.teamgoals[w] = { ...d, week: w, setBy: ME, setByName: mine.player.name }; commit(); },
    async setTeamLog(day, week, value) { mine.teamlogs[ME + '_' + day] = { uid: ME, day, week, value }; commit(); },
    pushState: () => mine.push ? 'on' : 'off',
    async enablePush() { mine.push = true; commit(); toast('Demo: Erinnerungen sind nur simuliert, es kommt nichts an.'); },
    async disablePush() { mine.push = false; commit(); toast('Erinnerungen aus.'); },
  };
}

// Service Worker (Push + installierbare App). Pfad relativ, damit er unter /fettsaecke/ läuft.
let SW = null;
function swReady() {
  if (!('serviceWorker' in navigator)) return Promise.resolve(undefined);
  return SW ||= navigator.serviceWorker.register('firebase-messaging-sw.js').then(() => navigator.serviceWorker.ready);
}

async function makeFirebaseDB(cfg, emit) {
  const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = A.initializeApp(cfg);
  const auth = Au.getAuth(app);
  const db = F.getFirestore(app);
  let S = emptyState(); let unsubs = []; let allSubbed = false;
  const fire = () => emit({ ...S });
  const fail = e => { console.error(e); toast(e.code === 'permission-denied' ? 'Keine Berechtigung (Regeln/Zeitfenster).' : 'Fehler: ' + (e.message || e)); };
  function subscribeAll() {
    if (allSubbed) return; allSubbed = true;
    // erst rendern/automatisch handeln, wenn ALLE Daten einmal geladen sind
    const need = new Set(['players', 'weighins', 'habitlogs', 'weekly', 'tasks', 'taskDone', 'teamgoals', 'teamlogs', 'private']);
    const got = n => { if (need.delete(n) && need.size === 0) S.synced = true; };
    // optional = neue Sammlungen: fehlen die Regeln noch, bleibt die App trotzdem benutzbar
    const col = (name, optional) => unsubs.push(F.onSnapshot(F.collection(db, name), qs => { const o = {}; qs.forEach(d => o[d.id] = d.data()); S[name] = o; if (name === 'players' && !o[S.me] && S.players[S.me]) o[S.me] = S.players[S.me]; got(name); fire(); },
      e => { if (optional) { console.warn(name, e.code); S[name] = {}; got(name); fire(); } else fail(e); }));
    ['players', 'weighins', 'habitlogs', 'weekly', 'tasks', 'taskDone'].forEach(n => col(n));
    ['teamgoals', 'teamlogs'].forEach(n => col(n, true));
    unsubs.push(F.onSnapshot(F.doc(db, 'players', S.me, 'private', 'weights'), s => { S.myWeights = s.exists() ? (s.data().slots || {}) : {}; got('private'); fire(); }, fail));
  }
  Au.onAuthStateChanged(auth, user => {
    unsubs.forEach(u => u()); unsubs = []; allSubbed = false; S = emptyState();
    if (!user) { S.ready = true; fire(); return; }
    S.authed = true; S.me = user.uid; S.displayName = user.displayName || '';
    if (LS.getItem('cdf-push-' + user.uid)) messaging().catch(() => { });
    unsubs.push(F.onSnapshot(F.doc(db, 'players', user.uid), snap => {
      if (snap.exists()) { S.players = { ...S.players, [user.uid]: snap.data() }; S.member = true; subscribeAll(); }
      else S.member = false;
      S.ready = true; fire();
    }, e => { S.ready = true; fail(e); fire(); }));
  });
  const me = () => S.me;
  // "zuletzt aktiv": nach eigenen Schreibvorgängen, höchstens alle CONFIG.activeEveryMin Minuten
  let lastTouch = 0;
  const touch = () => {
    if (!S.member) return;
    const t = Date.now(), k = 'cdf-active-' + S.me;
    if (t - Math.max(lastTouch, +LS.getItem(k) || 0, tsNum(S.players[S.me]?.lastActive)) < CONFIG.activeEveryMin * 60e3) return;
    lastTouch = t; LS.setItem(k, String(t));
    F.updateDoc(F.doc(db, 'players', S.me), { lastActive: F.serverTimestamp() }).catch(e => console.warn('lastActive', e.code));
  };
  const wrap = p => p.then(r => { touch(); return r; }, e => { fail(e); throw e; });
  // Push (Firebase Cloud Messaging)
  let msg = null;
  async function messaging() {
    if (msg) return msg;
    const M = await import(base + 'firebase-messaging.js');
    if (!(await M.isSupported())) return null;
    msg = { M, m: M.getMessaging(app) };
    M.onMessage(msg.m, p => toast([p.notification?.title, p.notification?.body].filter(Boolean).join(': ')));
    return msg;
  }
  const pushKey = () => 'cdf-push-' + S.me;
  return {
    demo: false,
    refresh: fire,
    async signIn() { const prov = new Au.GoogleAuthProvider(); try { await Au.signInWithPopup(auth, prov); } catch (e) { if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') await Au.signInWithRedirect(auth, prov); else fail(e); } },
    signOut: () => Au.signOut(auth),
    register: d => F.setDoc(F.doc(db, 'players', me()), { name: d.name, habits: d.habits, joinedSlot: d.joinedSlot, joinedAt: F.serverTimestamp(), lastActive: F.serverTimestamp(), invite: d.invite }).catch(e => { if (e.code === 'permission-denied') toast('Einladungscode falsch.'); else fail(e); throw e; }),
    updatePlayer: d => wrap(F.updateDoc(F.doc(db, 'players', me()), d)),
    saveWeigh(slot, kg, lossPct) {
      const b = F.writeBatch(db);
      b.set(F.doc(db, 'weighins', me() + '_' + slot), { uid: me(), slot, lossPct, ts: F.serverTimestamp() });
      b.set(F.doc(db, 'players', me(), 'private', 'weights'), { slots: { [slot]: kg } }, { merge: true });
      return wrap(b.commit());
    },
    setHabit: (day, done) => wrap(F.setDoc(F.doc(db, 'habitlogs', me() + '_' + day), { uid: me(), day, done })),
    setWeekly: (w, text, kind, target) => F.setDoc(F.doc(db, 'weekly', String(w)), { text, kind, target, setBy: me(), setByName: S.players[me()]?.name || '', ts: F.serverTimestamp() }).then(touch, e => { toast(e.code === 'permission-denied' ? 'Zu spät, jemand anderes war schneller.' : 'Fehler: ' + e.message); throw e; }),
    addTask: (e, text) => wrap(F.setDoc(F.doc(db, 'tasks', 'e' + e + '_' + me()), { etappe: e, text, createdBy: me(), createdByName: S.players[me()]?.name || '', ts: F.serverTimestamp() })),
    deleteTask: id => wrap(F.deleteDoc(F.doc(db, 'tasks', id))),
    markTask: (id, on) => wrap(on ? F.setDoc(F.doc(db, 'taskDone', id + '_' + me()), { uid: me(), taskId: id, confirmedBy: null, confirmedByName: null }) : F.deleteDoc(F.doc(db, 'taskDone', id + '_' + me()))),
    confirmTask: tdId => wrap(F.updateDoc(F.doc(db, 'taskDone', tdId), { confirmedBy: me(), confirmedByName: S.players[me()]?.name || '' })),
    setTeamGoal: (w, d) => F.setDoc(F.doc(db, 'teamgoals', String(w)), { ...d, week: w, setBy: me(), setByName: S.players[me()]?.name || '', ts: F.serverTimestamp() }).then(touch, e => { toast(e.code === 'permission-denied' ? 'Geht nicht: Für diese Woche gibt es schon ein Teamziel oder das Zeitfenster ist zu.' : 'Fehler: ' + e.message); throw e; }),
    setTeamLog: (day, week, value) => wrap(F.setDoc(F.doc(db, 'teamlogs', me() + '_' + day), { uid: me(), day, week, value })),
    pushState: () => LS.getItem(pushKey()) ? 'on' : 'off',
    async enablePush() {
      if (!CONFIG.vapidKey) return toast('Erinnerungen sind noch nicht eingerichtet: vapidKey fehlt in CONFIG (siehe README).');
      const x = await messaging().catch(() => null); if (!x) return toast('Dieser Browser kann keine Push-Nachrichten empfangen.');
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return toast('Benachrichtigungen sind blockiert. Erlaube sie in den Browser-Einstellungen.');
      const token = await x.M.getToken(x.m, { vapidKey: CONFIG.vapidKey, serviceWorkerRegistration: await swReady() });
      await F.setDoc(F.doc(db, 'players', me(), 'private', 'tokens'), { tokens: { [token]: { ts: F.serverTimestamp(), ua: navigator.userAgent.slice(0, 120) } } }, { merge: true });
      LS.setItem(pushKey(), token); fire(); toast('Erinnerungen sind auf diesem Gerät aktiv.');
    },
    async disablePush() {
      const token = LS.getItem(pushKey()); LS.removeItem(pushKey());
      if (token) {
        try { const x = await messaging(); if (x) await x.M.deleteToken(x.m); } catch { }
        await F.updateDoc(F.doc(db, 'players', me(), 'private', 'tokens'), new F.FieldPath('tokens', token), F.deleteField()).catch(() => { });
      }
      fire(); toast('Erinnerungen aus.');
    },
  };
}

let S = emptyState(), C = {}, DB = null, CHARTS = {};
const UI = { tab: 'heute', rankMode: 'gesamt', rankWeek: null, rankEtappe: null, etView: null, habitWeek: null, chartTable: false, modal: null };
let pendingRender = false, bumping = false;
const TABS = [['heute', 'Heute'], ['ranking', 'Ranking'], ['challenges', 'Challenges'], ['verlauf', 'Verlauf'], ['regeln', 'Regeln']];

function onState(ns) {
  S = ns; C = compute(S);
  // Startgewicht verpasst? -> automatisch nächsten Montag starten
  const p = S.players[S.me];
  if (S.member && S.synced && p && !C[S.me]?.active && S.myWeights[p.joinedSlot || 0] === undefined && slotDeadline(p.joinedSlot || 0) <= now() && !bumping) {
    const k = nextJoinSlot();
    if (k !== null && k > (p.joinedSlot || 0)) { bumping = true; DB.updatePlayer({ joinedSlot: k }).finally(() => bumping = false); }
  }
  checkMilestones();
  render();
}
function checkMilestones() { // einmaliger Toast, wenn ein neuer Meilenstein dazukommt
  const me = C[S.me]; if (!S.member || !S.synced || !me) return;
  const k = 'cdf-ms-' + S.me, raw = LS.getItem(k);
  if (raw === null) { LS.setItem(k, JSON.stringify(me.ms)); return; }
  let seen; try { seen = JSON.parse(raw) || []; } catch { seen = []; }
  const fresh = me.ms.filter(id => !seen.includes(id));
  if (!fresh.length) return;
  LS.setItem(k, JSON.stringify([...new Set([...seen, ...me.ms])]));
  // kurz nach der Bestätigung des Speicherns zeigen, sonst überschreibt die sie
  setTimeout(() => toast('Meilenstein erreicht: ' + fresh.map(id => MS_BY[id].label).join(', ')), 1600);
}
function render() {
  const a = document.activeElement;
  if (a && a.matches && a.matches('#app input, #app select') && a.value) { pendingRender = true; return; }
  pendingRender = false;
  CHARTS = {};
  document.getElementById('app').innerHTML = header() + banner() + body();
  const tabs = document.getElementById('tabs');
  document.body.classList.toggle('has-nav', !!S.member);
  if (S.member) {
    const me = S.players[S.me];
    tabs.hidden = false;
    tabs.innerHTML = `<div class="brand"><div class="logo">Club der Fettsäcke</div><div class="sub">${subline().replace(' · Topf', '<br>Topf')}</div></div>
      <div class="in">${TABS.map(([k, l]) => `<button class="${UI.tab === k ? 'on' : ''}" data-tab="${k}"${UI.tab === k ? ' aria-current="page"' : ''}>${svg(k)}<span>${l}</span></button>`).join('')}</div>
      <button class="prof" data-act="profile"><span class="avatar" aria-hidden="true">${esc((me?.name || '?').slice(0, 1).toUpperCase())}</span><span>${esc(me?.name)}<small>Profil und Erinnerungen</small></span></button>`;
  } else tabs.hidden = true;
  wireCharts();
  if (!document.activeElement?.closest?.('#modal')) renderModal();
}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) render(); }, 0));

function subline() {
  const cw = curWeek(); const po = pot(C);
  if (cw === 0) return `Start: ${fmtD(START)} · ${CONFIG.weeks} Wochen`;
  if (seasonOver()) return `Saison beendet · Topf ${eur(po.total)}`;
  return `Woche ${Math.min(cw, CONFIG.weeks)}/${CONFIG.weeks} · Etappe ${etappeOf(Math.min(cw, CONFIG.weeks))}/${NUM_ETAPPEN} · Topf ${eur(po.total)}`;
}
function header() {
  const me = S.players[S.me];
  return `<header class="apphead"><div><div class="logo">Club der Fettsäcke</div><div class="sub">${subline()}</div></div>
    ${me && S.member ? `<button class="avatar" data-act="profile" aria-label="Profil und Erinnerungen">${esc(me.name.slice(0, 1).toUpperCase())}</button>` : ''}</header>`;

function banner() {

const navBar = (act, cur, min, max, label) => `<div class="wnav"><button class="iconbtn" data-act="${act}" data-d="-1" ${cur <= min ? 'disabled' : ''} aria-label="Zurück">${svg('prev')}</button><b>${label}</b><button class="iconbtn" data-act="${act}" data-d="1" ${cur >= max ? 'disabled' : ''} aria-label="Weiter">${svg('next')}</button></div>`;
const weekRange = w => `${fmtD(dayDate(7 * (w - 1)))}–${fmtD(dayDate(7 * w - 1))}`;

function weighCard(me, p) {

function statusCard(me) {

    if (closed) {

    } else { const open = r.filter(x => !x.weighed); note = open.length ? `Noch nicht gewogen: ${names(open)}.` : 'Alle haben gewogen.'; }
  } else { head = `Woche ${w} · bis ${fmtD(dayDate(7 * w - 1))}`; note = `Waage-Punkte kommen am ${fmtD(slotStart(w))} dazu.`; }

    rank = `<div class="rankline"><span class="big">#${above.length + 1}</span><span class="t2">von ${r.length} · ${ptsStr(mine.total)}</span></div><p class="gap">${parts.slice(1).join(', ') || 'Alle gleichauf'}. <span class="muted">${note}</span></p><div class="lb">${lb}</div>`;
  } else if (mine) rank = `<div class="rankline"><span class="big">${ptsStr(mine.total)}</span></div><p class="small t2">${note}</p>`;
  const kv = [['Seit Start', lossStr(me.latest)]];

  const last = Math.max(...Object.keys(me.wb).map(Number));

const dayHeads = (d0, today) => [0, 1, 2, 3, 4, 5, 6].map(i => { const d = d0 + i; return `<span class="dh${d === today ? ' today' : ''}">${d === today ? 'Heute' : WD[(i + 1) % 7]}<b>${dayDate(d).getDate()}.</b></span>`; }).join('');
function habitsCard(me, p, focus) {

      g += `<button class="${cls}" ${edit ? `data-act="habit" data-day="${d}" data-h="${hi}"` : 'disabled'} aria-pressed="${on}" aria-label="${esc(plain)}, ${fmtD(dayDate(d))}">${svg('check', 'ck')}</button>`;

function pointsSeries() {

function drawChart(el) {
  const c = CHARTS[el.dataset.chart]; const W = Math.floor(el.clientWidth);
  if (!c || W < 120 || el._w === W) return; el._w = W;
  const s = c.series.filter(x => x.pts.length);
  if (!s.length) { el.innerHTML = '<p class="t2">Noch keine Daten.</p>'; return; }
  const H = clamp(Math.round(W * .55), 200, 320);

  const vals = s.flatMap(x => x.pts.map(p => p[1]));

  const raw = (hi - lo) / 4, mag = 10 ** Math.floor(Math.log10(raw || 1));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= raw - 1e-9);
  lo = Math.floor(lo / step + 1e-9) * step; hi = Math.ceil(hi / step - 1e-9) * step; if (hi <= lo) hi = lo + step;
  const xm = Math.max(c.xMin ?? 4, ...s.flatMap(x => x.pts.map(p => p[0])));
  const per = (W - L - R) / xm;
  const x = k => L + per * k, y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  let g = '';
  for (let i = 0; lo + i * step <= hi + 1e-9; i++) { const v = lo + i * step; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="${Math.abs(v) < 1e-9 ? 'zero' : 'gl'}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${c.yFmt(v)}</text>`; }
  const xs = [1, 2, 4, 8, 12, 24].find(n => n * per >= 36) || 24;
  for (let k = 0; k <= xm; k += xs) g += `<text x="${x(k)}" y="${H - 8}" text-anchor="middle">${c.xFmt(k)}</text>`;
  let lines = '', dl = ''; const lab = [];
  for (const se of s) {
    lines += `<polyline fill="none" style="stroke:${se.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${se.pts.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' ')}"/>`;
    if (se.pts.length <= 12) lines += se.pts.map(p => `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="3.5" style="fill:${se.color}" stroke="#1b1a16" stroke-width="1.5"/>`).join('');
    const lp = se.pts[se.pts.length - 1]; lab.push({ x: x(lp[0]), y: y(lp[1]), name: se.name });
  }
  if (names) { lab.sort((a, b) => a.y - b.y); for (let i = 1; i < lab.length; i++) if (lab[i].y - lab[i - 1].y < 15) lab[i].y = lab[i - 1].y + 15; dl = lab.map(l => `<text class="nm" x="${(l.x + 8).toFixed(1)}" y="${(l.y + 4).toFixed(1)}">${esc(l.name)}</text>`).join(''); }
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${el.dataset.chart === 'loss' ? 'Abnahme in Prozent pro Woche' : 'Punkte aufsummiert pro Woche'}">${g}<line class="xh" y1="${T}" y2="${H - B}" style="display:none"/>${lines}${dl}</svg><div class="tip" hidden></div>`;
  el._c = { x, xm, per, L, s, c };
  if (el._wired) return; el._wired = true;
  const move = ev => {
    const z = el._c, svgEl = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh'); if (!svgEl) return;
    const r = svgEl.getBoundingClientRect();

    if (!rows.length) { tip.hidden = true; xh.style.display = 'none'; return; }
    xh.setAttribute('x1', z.x(k)); xh.setAttribute('x2', z.x(k)); xh.style.display = '';

  if (me?.active) {
    const got = MILESTONES.filter(x => me.ms.includes(x.id)).map(x => x.label);
    const next = ['l', 'w', 's'].map(c => MILESTONES.find(x => x.cat === c && !me.ms.includes(x.id))).filter(Boolean).map(x =>
      x.cat === 'l' ? `${x.label} (noch ${fmt1(x.n - me.bestLoss)} %)` : x.cat === 'w' ? `${x.label} (bisher ${me.weighRun})` : `${x.label} (Rekord ${me.streak.best})`);
    ms = `<h3>Meilensteine</h3><p class="small t2">${got.length ? 'Erreicht: ' + got.join(', ') + '.' : 'Noch keiner erreicht.'}</p>${next.length ? `<p class="small muted">Als Nächstes: ${next.join(' · ')}</p>` : ''}`;
  }
  m.innerHTML = `<div class="modal" data-act="closeModal"><div class="sheet" data-stop role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <div class="hd" style="align-items:center"><h2 id="pTitle">Profil</h2><button class="iconbtn" data-act="closeModal" aria-label="Schließen">${svg('close')}</button></div>
    <label class="f" for="pName">Name</label><input class="inp" id="pName" maxlength="20" value="${esc(p.name)}">
    <label class="f">Gewohnheiten ${he ? '' : '<span class="muted">(gesperrt bis zur 1. Woche der nächsten Etappe)</span>'}</label>
    <div class="stack">${[0, 1, 2].map(i => `<input class="inp" id="pH${i}" maxlength="40" value="${esc(p.habits?.[i] || '')}" ${he ? '' : 'disabled'} aria-label="Gewohnheit ${i + 1}">`).join('')}</div>
    <button class="btn full" data-act="saveProfile">Speichern</button>
    <h3>Erinnerungen</h3>${push}${ms}${code}
    ${DEMO ? '' : `<h3>Konto</h3><button class="link" data-act="signout">Abmelden</button>`}</div></div>`;
}

/* ---------- EVENTS ---------- */
const val = id => (document.getElementById(id)?.value || '').trim();
const intVal = id => parseInt(val(id).replace(/[^\d]/g, ''), 10);
document.addEventListener('click', async ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { UI.tab = tab.dataset.tab; window.scrollTo(0, 0); render(); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'closeModal' && ev.target.closest('[data-stop]') && el.classList.contains('modal')) return;
  const a = el.dataset.act;
  try {
    switch (a) {
      case 'signin': await DB.signIn(); break;
      case 'signout': UI.modal = null; await DB.signOut(); break;
      case 'register': {
        const name = val('rName'), habits = [val('rH0'), val('rH1'), val('rH2')];
        if (!name) return toast('Name fehlt.');
        if (habits.some(h => !h)) return toast('Bitte alle 3 Gewohnheiten eintragen.');
        const k = nextJoinSlot(); if (k === null) return;
        await DB.register({ name, habits, joinedSlot: k, invite: DEMO ? 'DEMO' : val('rCode') });
        toast(`Dabei. Startgewicht am ${fmtD(slotStart(k))} bis ${CONFIG.deadlineHour} Uhr eintragen.`); break;
      }
      case 'weigh': {
        const slot = +el.dataset.slot; const kg = parseFloat(val('kg').replace(',', '.'));
        if (!(kg >= 30 && kg <= 300)) return toast('Bitte ein gültiges Gewicht eingeben.');
        const p = S.players[S.me]; const js = p.joinedSlot || 0;
        let loss = 0;
        if (slot !== js) { const st = S.myWeights[js]; if (!st) return toast('Startgewicht fehlt.'); loss = Math.round((st - kg) / st * 10000) / 100; }
        document.activeElement?.blur();
        await DB.saveWeigh(slot, Math.round(kg * 10) / 10, loss);
        toast(slot === js ? 'Startgewicht gespeichert.' : `Gespeichert: ${lossStr(loss)} seit Start`); break;
      }
      case 'habit': {
        el.classList.toggle('on'); el.setAttribute('aria-pressed', el.classList.contains('on')); // sofortiges Feedback
        const d = +el.dataset.day, i = +el.dataset.h; const cur = (C[S.me].hl[d] || []).slice(0, 4).map(Boolean);
        while (cur.length < 4) cur.push(false); cur[i] = !cur[i]; await DB.setHabit(d, cur); break;
      }
      case 'hw': {
        const cur = Math.min(curWeek(), CONFIG.weeks); const minW = Math.min(cur, Math.max(1, (S.players[S.me]?.joinedSlot || 0) + 1));
        UI.habitWeek = clamp((UI.habitWeek ?? cur) + +el.dataset.d, minW, cur); if (UI.habitWeek === cur) UI.habitWeek = null; render(); break;
      }
      case 'setWeekly': {
        const t = val('wText'); if (!t) return toast('Text fehlt.');
        const k = document.getElementById('wKind')?.value || 'daily';
        document.activeElement?.blur();
        await DB.setWeekly(+el.dataset.w, t, k === 'daily' ? 'daily' : 'count', k === 'daily' ? 7 : +k); toast('Challenge gespeichert.'); break;
      }
      case 'setTeam': {
        const w = +el.dataset.w, text = val('gText'), kind = val('gKind') === 'count' ? 'count' : 'sum', target = intVal('gTarget'), unit = kind === 'sum' ? val('gUnit').slice(0, 20) : '';
        if (!text) return toast('Text fehlt.');
        if (!(target >= 1 && target <= 1e7)) return toast('Ziel als Zahl zwischen 1 und 10.000.000 eingeben.');
        document.activeElement?.blur();
        await DB.setTeamGoal(w, { text, kind, target, unit }); toast(`Teamziel für Woche ${w} gespeichert.`); break;
      }
      case 'teamLog': {
        const d = +val('tmDay'), v = intVal('tmVal');
        if (!(v >= 0 && v <= 1e6)) return toast('Bitte eine Zahl zwischen 0 und 1.000.000 eingeben.');
        if (!teamEditable(d, C[S.me]?.js || 0)) return toast('Dieser Tag ist nicht mehr offen.');
        document.activeElement?.blur();
        await DB.setTeamLog(d, weekOfDay(d), v); toast(`Eingetragen: ${nf(v)} für ${fmtD(dayDate(d))}`); break;
      }
      case 'teamTog': {
        const d = +el.dataset.day, on = (S.teamlogs[S.me + '_' + d]?.value || 0) > 0;
        el.classList.toggle('on', !on); await DB.setTeamLog(d, weekOfDay(d), on ? 0 : 1); break;
      }
      case 'addTask': { const t = val('tText'); if (!t) return toast('Text fehlt.'); document.activeElement?.blur(); await DB.addTask(+el.dataset.e, t); break; }
      case 'delTask': await DB.deleteTask(el.dataset.id); break;
      case 'mark': await DB.markTask(el.dataset.id, el.dataset.on === '1'); break;
      case 'confirm': await DB.confirmTask(el.dataset.id); toast('Bestätigt.'); break;
      case 'rmode': UI.rankMode = el.dataset.m; render(); break;
      case 'rw': UI.rankWeek = clamp(UI.rankWeek + +el.dataset.d, 1, CONFIG.weeks); render(); break;
      case 're': UI.rankEtappe = clamp(UI.rankEtappe + +el.dataset.d, 1, NUM_ETAPPEN); render(); break;
      case 'ev': UI.etView = clamp(UI.etView + +el.dataset.d, 1, NUM_ETAPPEN); render(); break;
      case 'ctab': UI.chartTable = !UI.chartTable; render(); break;
      case 'profile': UI.modal = 'profile'; renderModal(); document.getElementById('pName')?.focus({ preventScroll: true }); break;
      case 'closeModal': UI.modal = null; renderModal(); break;
      case 'push': await DB.enablePush(); renderModal(); break;
      case 'pushOff': await DB.disablePush(); renderModal(); break;
      case 'saveProfile': {
        const name = val('pName'); if (!name) return toast('Name fehlt.');
        const d = { name }; if (habitsEditable()) { const hs = [val('pH0'), val('pH1'), val('pH2')]; if (hs.some(h => !h)) return toast('3 Gewohnheiten nötig.'); d.habits = hs; }
        document.activeElement?.blur(); await DB.updatePlayer(d); UI.modal = null; renderModal(); toast('Gespeichert'); break;
      }
      case 'demoReset': DB.reset(); UI.rankWeek = UI.rankEtappe = UI.etView = UI.habitWeek = null; break;
      case 'demoMon': { const d = dayIdx(); const k = Math.max(0, Math.floor(d / 7) + 1); const t = slotStart(Math.min(k, CONFIG.weeks)); t.setHours(9); setNow(t); break; }
    }
  } catch (e) { console.warn(e); /* Fehler wurde schon angezeigt */ }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'demoTime' && ev.target.value) setNow(new Date(ev.target.value));
  if (ev.target.id === 'tmDay') { const i = document.getElementById('tmVal'); if (i) i.value = S.teamlogs[S.me + '_' + ev.target.value]?.value || ''; }
});
function setNow(t) { NOW_OVERRIDE = t.getTime(); LS.setItem('cdf-demo-now', String(NOW_OVERRIDE)); UI.rankWeek = UI.rankEtappe = UI.etView = UI.habitWeek = null; DB.refresh(); }
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && UI.modal) { UI.modal = null; renderModal(); return; }
  if (ev.key === 'Enter' && ev.target.matches('#app input') && ev.target.parentElement.classList.contains('row')) { const b = ev.target.parentElement.querySelector('.btn') || null; if (b) b.click(); }
});

/* ---------- START ---------- */
(async function init() {
  if (DEMO) {
    const q = new URLSearchParams(location.search).get('now');
    const stored = +LS.getItem('cdf-demo-now');
    if (q) NOW_OVERRIDE = new Date(q).getTime();
    else if (stored) NOW_OVERRIDE = stored;
    else { const t = dayDate(14); t.setHours(9); NOW_OVERRIDE = Math.max(Date.now(), t.getTime()); }
    DB = makeDemoDB(onState);
  } else {
    const q = new URLSearchParams(location.search).get('now');
    if (CONFIG.testMode && q) NOW_OVERRIDE = new Date(q).getTime();
    swReady().catch(e => console.warn('Service Worker', e));
    try { DB = await makeFirebaseDB(CONFIG.firebase, onState); }
    catch (e) { console.error(e); document.getElementById('app').innerHTML = `<section class="card"><div class="hd"><h2>Verbindung fehlgeschlagen</h2></div><p class="t2">Firebase konnte nicht geladen werden. Prüf die Config in der index.html.</p></section>`; }
  }
  setInterval(() => { if (S.ready && !UI.modal) render(); }, 60000);
})();
</script>
</body>
</html>
