<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Club der Fettsäcke</title>
<meta name="theme-color" content="#121211">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23ff7a1a'/><path d='M11 24V8h11M11 16h8' fill='none' stroke='%231d0e00' stroke-width='4'/></svg>">
<style>
:root{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#2e2e2b; --line-2:#4a4a45;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8c8b83;
  --accent:#ff7a1a; --accent-ink:#1d0e00;
  --ch:#e6b34d; --good:#7fd67f; --bad:#ec8080;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --r:10px; --r-sm:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{padding:20px 0 12px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:1.2}
.sub{color:var(--text-2);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.avatar{margin-left:auto;width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-weight:800;cursor:pointer}
.banner{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font-size:13px;color:var(--text-2);margin:0 0 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.banner b{color:var(--text)}
.banner input{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 6px;font-size:13px}
.loading{color:var(--muted);padding:24px 0;margin:0}
.muted{color:var(--muted)} .t2{color:var(--text-2)} .small{font-size:13px} .ok{color:var(--good)} .bad{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:8px}
.cd{font-variant-numeric:tabular-nums}
/* Karten: ein vertikaler Rhythmus statt Einzel-Margins */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card>*,.sheet>*{margin-top:0;margin-bottom:0}
.card>*+*,.sheet>*+*{margin-top:12px}
.card>label.f+*,.sheet>label.f+*{margin-top:6px}
.card>.btn,.card>.link,.sheet>.btn,.sheet>.link,.lead>.btn{display:block}
.card h2,.sheet h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.card h3{margin:20px 0 0;font-size:14px;font-weight:700;line-height:1.4}
.card h3+*{margin-top:8px}
label.f{display:block;font-size:13px;color:var(--text-2)}
/* Buttons: ein Primär-Button pro Bereich, Rest ghost oder Link */
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:var(--r-sm)}
.btn.full{width:100%}
.link{border:0;background:none;padding:0;color:var(--text-2);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:hover{color:var(--text)}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;outline:none}
.inp:focus{border-color:var(--text-2)}
select.inp{appearance:auto}
.num{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.num small{display:block;font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:4px}
.tag{display:inline-block;border:1px solid var(--line-2);border-radius:4px;padding:0 6px;font-size:12px;line-height:20px;color:var(--text-2);white-space:nowrap}
.tag.ok{color:var(--good);border-color:rgba(127,214,127,.4)}
.tag.bad{color:var(--bad);border-color:rgba(236,128,128,.45)}
/* Fokus oben auf "Heute": das eine Element in Akzentfarbe */
.lead{padding:4px 0 20px;border-bottom:1px solid var(--line)}
.lead>*{margin:0}
.lead>*+*{margin-top:8px}
.lead>.row{margin-top:16px}
.lead .k{font-size:13px;color:var(--text-2)}
.lead .big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1.05;color:var(--accent);font-variant-numeric:tabular-nums}
.lead .big span{font-size:18px;font-weight:700;letter-spacing:0;color:var(--text-2)}
.lead .s{font-size:16px;font-weight:600}
.lead .n{font-size:13px;color:var(--text-2)}
/* Gewohnheiten-Grid */
.hgrid{display:grid;grid-template-columns:minmax(64px,1.4fr) repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.hgrid .dh{font-size:11px;line-height:1.3;color:var(--muted);text-align:center}
.hgrid .dh.today{color:var(--text);font-weight:800}
.hname{font-size:12px;line-height:1.25;color:var(--text-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.hname.ch{color:var(--ch);font-weight:700}
.hc{aspect-ratio:1;width:100%;padding:0;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--accent)}
.hc.on{background:rgba(255,122,26,.16);border-color:rgba(255,122,26,.6)}
.hc.chc{color:var(--ch)}
.hc.chc.on{background:rgba(230,179,77,.14);border-color:rgba(230,179,77,.6)}
.hc.edit{cursor:pointer}
.hc.edit:not(.on){border-color:var(--line-2)}
.hc.lock{opacity:.45}
.hc.off{opacity:.15}
.score{font-size:13px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.score b{color:var(--text)}
ol.plain{padding-left:20px;color:var(--text-2)}
.chtext{font-size:18px;font-weight:800;line-height:1.3}
/* Ranking */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:var(--r-sm);font-weight:700;cursor:pointer;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.rk{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0;padding-top:0}
.rk:last-child{padding-bottom:0}
.rk .pos{font-weight:900;font-size:18px;line-height:1.3;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rk.first .pos{color:var(--accent)}
.rk .nm{font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.rk .br{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:4px;font-size:12px;color:var(--muted)}
.rk .br b{color:var(--text-2);font-weight:700}
.rk .pts{font-weight:800;font-size:22px;line-height:1.1;text-align:right;font-variant-numeric:tabular-nums}
.rk .pts small{display:block;margin-top:4px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:15px;text-align:center}
.wrap>.nav{margin:12px 0}
.foot{font-size:13px;color:var(--muted);margin:0 0 12px}
/* Aufgaben */
.task{border-top:1px solid var(--line);padding-top:12px}
.task .tt{font-weight:700}
.task .who{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px}
.wk{flex:none;width:32px;font-size:13px;font-weight:800;color:var(--muted);line-height:22px}
/* Verlauf */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#0b0b0b;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;min-width:120px;display:none;z-index:5}
.tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tscroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:600}
table.t.k td,table.t.k th{font-size:12px;padding:6px 3px}
table.t tr.sum td{font-weight:800;border-bottom:0}
/* Navigation unten */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tabs .in{max-width:640px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:transparent;padding:8px 2px 6px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--text);font-weight:700}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:608px;margin:0 auto;background:#0b0b0b;border:1px solid var(--line-2);border-radius:8px;padding:10px 14px;font-size:14px;z-index:30;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 0 0;width:100%;max-width:640px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.rules p,.rules li{color:var(--text-2)} .rules b{color:var(--text)}
.rules ul{margin:8px 0 0;padding-left:20px}
.rules li+li{margin-top:4px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="loading">Lade…</p></div>
<div class="tabs" id="tabs" style="display:none"></div>
<div class="toast" id="toast"></div>
<div id="modal"></div>

<script type="module">
/* =====================================================================
   KONFIGURATION – hier anpassen
   ===================================================================== */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyBurXm-bT9lu_O_QddU_eUO2MwkjgmXUmo",
    authDomain: "club-der-fettsaecke.firebaseapp.com",
    projectId: "club-der-fettsaecke",
    storageBucket: "club-der-fettsaecke.firebasestorage.app",
    messagingSenderId: "121079785562",
    appId: "1:121079785562:web:a808ec1074af013dd49063"
  },
  testMode: true,    // TEST: true = Zeit per URL ?now=2026-11-30T09:00 simulierbar. VOR DEM START WIEDER AUF false!
  start: { y: 2026, m: 11, d: 23 }, // Montag, 23.11.2026 (muss ein Montag sein!)
  weeks: 24,          // Saisonlänge in Wochen (24 = ca. 6 Monate)
  etappeWeeks: 4,     // Wochen pro Etappe ("Monat")
  einsatz: 10,        // € Einsatz pro Person (einmalig)
  strafe: 2,          // € pro verpasstem Wiegen
  loserFee: 1,        // € für den Letzten im Wochenranking
  deadlineHour: 12,   // Wiegen montags bis 12:00 Uhr
  chooseHours: 12,    // so lange darf NUR der Wochenletzte die Challenge wählen, danach jeder
  backfillDays: 2,    // Gewohnheiten bis zu 2 Tage nachtragen
  weighPerTenth: 3,   // Waage-Punkte pro 0,1 % unter dem bisherigen Tiefstwert
  weighMaxTenths: 10, // max. 1 % pro Woche zählt (= 30 Punkte)
  challengePts: 6,    // max. Punkte Wochen-Challenge
  taskPts: 15,        // Punkte pro Extra-Aufgabe (jeder stellt 1 Aufgabe pro Etappe)
};
// Wenn du start/weeks änderst: auch START_MS in firestore.rules anpassen.

/* ===================================================================== */
const DAY = 864e5;
const START = new Date(CONFIG.start.y, CONFIG.start.m - 1, CONFIG.start.d);
const COLORS = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const DEMO = !CONFIG.firebase;
const TIMETRAVEL = DEMO || CONFIG.testMode;

/* ---------- Zeit ---------- */
let NOW_OVERRIDE = null;
const now = () => NOW_OVERRIDE ? new Date(NOW_OVERRIDE) : new Date();
const dayDate = d => new Date(START.getFullYear(), START.getMonth(), START.getDate() + d);
const dayIdx = (t = now()) => Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - START) / DAY);
const slotStart = k => dayDate(7 * k);
const slotDeadline = k => { const x = dayDate(7 * k); x.setHours(CONFIG.deadlineHour); return x; };
const weekOfDay = d => d < 0 ? 0 : Math.floor(d / 7) + 1;
const curWeek = () => Math.min(weekOfDay(dayIdx()), CONFIG.weeks + 1); // 0 = vor Start, weeks+1 = vorbei
const etappeOf = w => Math.max(1, Math.ceil(w / CONFIG.etappeWeeks));
const NUM_ETAPPEN = Math.ceil(CONFIG.weeks / CONFIG.etappeWeeks);
function lastClosedSlot() { const t = now(); let k = -1; for (let i = 0; i <= CONFIG.weeks; i++) { if (slotDeadline(i) <= t) k = i; else break; } return k; }
function openSlot() { const t = now(), d = dayIdx(t); if (d >= 0 && d % 7 === 0 && d / 7 <= CONFIG.weeks && t >= slotStart(d / 7) && t < slotDeadline(d / 7)) return d / 7; return null; }
function nextJoinSlot() { const t = now(); for (let k = 0; k < CONFIG.weeks; k++) if (slotDeadline(k) > t) return k; return null; }
const seasonOver = () => lastClosedSlot() >= CONFIG.weeks;

/* ---------- Helfer ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmt1 = x => x.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const fmtD = d => `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.`;
const lossStr = x => (x > 0.049 ? '−' : x < -0.049 ? '+' : '±') + fmt1(Math.abs(x)) + ' %';
const eur = x => x.toLocaleString('de-DE') + ' €';
function countdown(to) {
  let s = Math.max(0, Math.floor((to - now()) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60);
  return d > 0 ? `${d} T ${h} Std` : h > 0 ? `${h} Std ${m} Min` : `${m} Min`;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 3200); }
function safeLS() { try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch { const m = {}; return { getItem: k => m[k] ?? null, setItem: (k, v) => m[k] = String(v), removeItem: k => delete m[k] }; } }
const LS = safeLS();

/* =====================================================================
   PUNKTE-LOGIK
   ===================================================================== */
function compute(S) {
  const C = {};
  const lc = lastClosedSlot();
  const ordered = Object.entries(S.players).sort((a, b) => (tsNum(a[1].joinedAt) - tsNum(b[1].joinedAt)) || a[0].localeCompare(b[0]));
  const hlBy = {};
  for (const h of Object.values(S.habitlogs)) (hlBy[h.uid] ||= {})[h.day] = h.done || [];
  ordered.forEach(([uid, p], idx) => {
    const js = p.joinedSlot || 0;
    const wb = {};
    for (const w of Object.values(S.weighins)) if (w.uid === uid && typeof w.lossPct === 'number') wb[w.slot] = w.lossPct;
    const active = wb[js] !== undefined;
    const hl = hlBy[uid] || {};
    const weeks = {};
    let best = 0;
    for (let w = js + 1; w <= CONFIG.weeks; w++) {
      const has = wb[w] !== undefined;
      const weigh = has ? clamp(Math.floor((wb[w] - best) * 10 + 1e-6), 0, CONFIG.weighMaxTenths) * CONFIG.weighPerTenth : 0;
      if (has) best = Math.max(best, wb[w]);
      let habits = 0, chCnt = 0;
      for (let d = 7 * (w - 1); d < 7 * w; d++) if (hl[d]) { habits += hl[d].slice(0, 3).filter(Boolean).length; if (hl[d][3]) chCnt++; }
      const weekly = challengePoints(S.weekly[w], chCnt);
      weeks[w] = { weigh, habits, weekly, chCnt, total: weigh + habits + weekly, weighed: has };
    }
    const taskPts = {};
    for (const td of Object.values(S.taskDone)) {
      const t = S.tasks[td.taskId];
      if (td.uid === uid && td.confirmedBy && t) taskPts[t.etappe] = (taskPts[t.etappe] || 0) + CONFIG.taskPts;
    }
    const missedSlots = [];
    if (active) for (let k = js + 1; k <= Math.min(lc, CONFIG.weeks); k++) if (wb[k] === undefined) missedSlots.push(k);
    const missed = missedSlots.length;
    const slots = Object.keys(wb).map(Number).sort((a, b) => a - b);
    const latest = slots.length ? wb[slots[slots.length - 1]] : 0;
    C[uid] = { uid, name: p.name, habitsList: p.habits || [], js, wb, hl, active, weeks, taskPts, missed, missedSlots, loserWeeks: [], latest, color: COLORS[idx % COLORS.length] };
  });
  for (let w = 1; w <= Math.min(lc, CONFIG.weeks); w++) for (const u of weekLosers(C, w)) C[u].loserWeeks.push(w);
  return C;
}
function chTarget(ch) { return ch?.kind === 'daily' ? 7 : clamp(ch?.target || 1, 1, 7); }
function challengePoints(ch, n) {
  if (!ch || !n) return 0;
  if (ch.kind === 'daily') return Math.min(n, CONFIG.challengePts);
  const t = chTarget(ch); return Math.min(n, t) * Math.round(CONFIG.challengePts / t);
}
const chLabel = ch => ch.kind === 'daily' ? 'täglich' : chTarget(ch) + '× diese Woche';
function weekLosers(C, w) { // Letzte(r) einer abgeschlossenen Woche, nur wenn nicht alle gleich
  const r = rankWeek(C, w); if (r.length < 2) return [];
  const min = Math.min(...r.map(x => x.total)), max = Math.max(...r.map(x => x.total));
  return min === max ? [] : r.filter(x => x.total === min).map(x => x.uid);
}
function fees(p, e) { // e = Etappe oder null für gesamt
  const inE = w => e === null || etappeOf(w) === e;
  const einsatz = p.active && (e === null || etappeOf(p.js + 1) === e) ? CONFIG.einsatz : 0;
  const missed = p.missedSlots.filter(inE).length, losers = p.loserWeeks.filter(inE).length;
  return { einsatz, missed, losers, strafen: missed * CONFIG.strafe + losers * CONFIG.loserFee, total: einsatz + missed * CONFIG.strafe + losers * CONFIG.loserFee };
}
const fmtDT = d => fmtD(d) + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const exclusiveUntil = w => new Date(slotDeadline(w - 1).getTime() + CONFIG.chooseHours * 3600e3);
function tsNum(t) { if (!t) return 0; if (typeof t === 'number') return t; if (t.toMillis) return t.toMillis(); if (t.seconds) return t.seconds * 1000; return 0; }
function sortRank(arr) { return arr.sort((a, b) => b.total - a.total || b.latest - a.latest || a.name.localeCompare(b.name)); }
function rankWeek(C, w) {
  return sortRank(Object.values(C).filter(p => p.active && p.js < w && p.weeks[w]).map(p => ({ ...p.weeks[w], uid: p.uid, name: p.name, color: p.color, latest: p.latest, tasks: 0 })));
}
function rankRange(C, wFrom, wTo, etappen) {
  return sortRank(Object.values(C).filter(p => p.active && p.js < wTo).map(p => {
    const r = { uid: p.uid, name: p.name, color: p.color, latest: p.latest, weigh: 0, habits: 0, weekly: 0, tasks: 0, missed: p.missed };
    for (let w = wFrom; w <= wTo; w++) if (p.weeks[w]) { r.weigh += p.weeks[w].weigh; r.habits += p.weeks[w].habits; r.weekly += p.weeks[w].weekly; }
    for (const e of etappen) r.tasks += p.taskPts[e] || 0;
    r.total = r.weigh + r.habits + r.weekly + r.tasks;
    return r;
  }));
}
const rankTotal = C => rankRange(C, 1, CONFIG.weeks, Array.from({ length: NUM_ETAPPEN }, (_, i) => i + 1));
const rankEtappe = (C, e) => rankRange(C, (e - 1) * CONFIG.etappeWeeks + 1, Math.min(e * CONFIG.etappeWeeks, CONFIG.weeks), [e]);
function pot(C) { const r = { total: 0, players: 0, missed: 0, losers: 0 }; for (const p of Object.values(C)) if (p.active) { const f = fees(p, null); r.total += f.total; r.players++; r.missed += f.missed; r.losers += f.losers; } return r; }
function weeklySetters(C, w) { // null = jeder, [] = noch offen
  if (w <= 1) return null;
  if (lastClosedSlot() < w - 1) return [];
  const r = rankWeek(C, w - 1); if (!r.length) return null;
  const min = Math.min(...r.map(x => x.total)); return r.filter(x => x.total === min).map(x => x.uid);
}
function canSetWeekly(S, C, w) {
  if (S.weekly[w] || w < 1 || w > CONFIG.weeks) return false;
  const cw = curWeek();
  if (w === 1) return cw <= 1;
  if (cw !== w || now() < slotDeadline(w - 1)) return false; // erst nach dem Wiegen
  if (now() >= exclusiveUntil(w)) return true;                // danach: jeder, wer zuerst kommt
  const s = weeklySetters(C, w); return s === null || s.includes(S.me);
}
const habitsEditable = () => { const cw = curWeek(); return cw === 0 || (cw <= CONFIG.weeks && (cw - 1) % CONFIG.etappeWeeks === 0); };
function taskEditable(e) { const cw = curWeek(); if (cw === 0) return e === 1; const end = Math.min(e * CONFIG.etappeWeeks, CONFIG.weeks); return (etappeOf(cw) === e && cw <= CONFIG.weeks) || (now() < slotDeadline(end)); }

const emptyState = () => ({ ready: false, synced: false, authed: false, member: false, me: null, players: {}, weighins: {}, habitlogs: {}, weekly: {}, weeklyDone: {}, tasks: {}, taskDone: {}, myWeights: {} });

function rng(seed) { let h = 1779033703 ^ seed.length; for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; }

function makeDemoDB(emit) {
  const KEY = 'cdf-demo-v1';

  let mine; try { mine = JSON.parse(LS.getItem(KEY)) || null; } catch { mine = null; }

  const BOTS = [
    { uid: 'bot-siggi', name: 'Siggi', start: 104.6, trend: 0.75, disc: 0.75, habits: ['10.000 Schritte', 'Kein Fast Food', 'Kein Zucker nach 18 Uhr'], joined: 1 },
    { uid: 'bot-julian', name: 'Julian', start: 91.2, trend: 0.55, disc: 0.6, habits: ['Training (min. 45 Min)', 'Kein Alkohol', '2 L Wasser'], joined: 2 },
  ];
  const WEEKLY_TXT = [{ text: 'Treppe statt Aufzug', kind: 'daily' }, { text: '2× Sport (min. 45 Min)', kind: 'count', target: 2 }, { text: 'Kein Lieferdienst', kind: 'daily' }, { text: '1× 5 km laufen', kind: 'count', target: 1 }, { text: '20 Min spazieren', kind: 'daily' }];
  function seed() {
    const S = { players: {}, weighins: {}, habitlogs: {}, weekly: {}, weeklyDone: {}, tasks: {}, taskDone: {} };
    const t = now(), today = dayIdx(t), lc = lastClosedSlot(), os = openSlot();
    for (const b of BOTS) {
      S.players[b.uid] = { name: b.name, habits: b.habits, joinedSlot: 0, joinedAt: b.joined };
      const r = rng(b.uid); let kg = b.start;
      for (let k = 0; k <= CONFIG.weeks; k++) {
        const due = k <= lc || (os === k && b.uid === 'bot-siggi');
        if (!due) break;
        if (k > 0) kg += -b.start * b.trend / 100 + (r() - 0.45) * 0.9;
        if (k > 0 && r() < 0.07) continue; // verpasst
        S.weighins[b.uid + '_' + k] = { uid: b.uid, slot: k, lossPct: Math.round((b.start - kg) / b.start * 10000) / 100 };
      }
      for (let d = 0; d < today && d < CONFIG.weeks * 7; d++) {
        const rr = rng(b.uid + d);
        S.habitlogs[b.uid + '_' + d] = { uid: b.uid, day: d, done: [rr() < b.disc, rr() < b.disc - .1, rr() < b.disc + .1, rr() < b.disc - .2] };
      }
    }
    for (let w = 1; w <= Math.min(curWeek(), CONFIG.weeks); w++) {
      if (mine.weekly[w]) continue;
      if (w === curWeek() && w > 1 && dayIdx() === 7 * (w - 1)) continue; // Montag: der Wochenletzte ist dran
      S.weekly[w] = { ...WEEKLY_TXT[(w - 1) % WEEKLY_TXT.length], setBy: w % 2 ? 'bot-julian' : 'bot-siggi', setByName: w % 2 ? 'Julian' : 'Siggi' };
    }
    const ce = curWeek() >= 1 ? etappeOf(Math.min(curWeek(), CONFIG.weeks)) : 0;
    for (let e = 1; e <= ce; e++) {
      const ta = 'e' + e + '_bot-siggi', tb = 'e' + e + '_bot-julian';
      S.tasks[ta] = { etappe: e, text: '2× 5 km laufen', createdBy: 'bot-siggi', createdByName: 'Siggi', ts: 1 };
      S.taskDone[ta + '_bot-siggi'] = { uid: 'bot-siggi', taskId: ta, confirmedBy: 'bot-julian', confirmedByName: 'Julian' };
      if (e < ce || dayIdx() % 28 > 10) {
        S.tasks[tb] = { etappe: e, text: '1 Stunde schwimmen', createdBy: 'bot-julian', createdByName: 'Julian', ts: 2 };
        S.taskDone[tb + '_bot-julian'] = { uid: 'bot-julian', taskId: tb, confirmedBy: null };
      }
    }
    return S;
  }
  function state() {
    const s = seed();
    const S = { ...emptyState(), ready: true, synced: true, authed: true, me: ME };
    S.member = !!mine.player;
    for (const k of ['players', 'weighins', 'habitlogs', 'weekly', 'weeklyDone', 'tasks', 'taskDone']) S[k] = { ...s[k], ...(k === 'players' ? {} : mine[k]) };
    if (mine.player) S.players[ME] = mine.player;
    S.myWeights = { ...mine.myWeights };
    return S;
  }
  const commit = () => { save(); emit(state()); };
  setTimeout(() => emit(state()));
  return {
    demo: true, refresh: () => emit(state()),
    signIn() { }, signOut() { },
    reset() { LS.removeItem(KEY); mine = { player: null, weighins: {}, habitlogs: {}, weekly: {}, weeklyDone: {}, tasks: {}, taskDone: {}, myWeights: {} }; commit(); },
    async register(d) { mine.player = { name: d.name, habits: d.habits, joinedSlot: d.joinedSlot, joinedAt: Date.now(), invite: 'DEMO' }; commit(); },
    async updatePlayer(d) { Object.assign(mine.player, d); commit(); },
    async saveWeigh(slot, kg, lossPct) { mine.weighins[ME + '_' + slot] = { uid: ME, slot, lossPct }; mine.myWeights[slot] = kg; commit(); },
    async setHabit(day, done) { mine.habitlogs[ME + '_' + day] = { uid: ME, day, done }; commit(); },
    async setWeekly(w, text, kind, target) { mine.weekly[w] = { text, kind, target, setBy: ME, setByName: mine.player.name }; commit(); },
    async addTask(e, text) { const id = 'e' + e + '_' + ME; mine.tasks[id] = { etappe: e, text, createdBy: ME, createdByName: mine.player.name, ts: Date.now() }; commit(); },
    async deleteTask(id) { delete mine.tasks[id]; for (const k of Object.keys(mine.taskDone)) if (k.startsWith(id + '_')) delete mine.taskDone[k]; commit(); },
    async markTask(id, on) {
      const k = id + '_' + ME;
      if (on) { mine.taskDone[k] = { uid: ME, taskId: id, confirmedBy: null }; setTimeout(() => { if (mine.taskDone[k]) { mine.taskDone[k].confirmedBy = 'bot-julian'; mine.taskDone[k].confirmedByName = 'Julian'; commit(); toast('Julian hat deine Aufgabe bestätigt.'); } }, 2500); }
      else delete mine.taskDone[k];
      commit();
    },
    async confirmTask(tdId) {
      const td = mine.taskDone[tdId] || null;
      if (td) { td.confirmedBy = ME; td.confirmedByName = mine.player.name; }
      else { // Bot-Eintrag: als eigene Kopie übernehmen
        const s = seed().taskDone[tdId]; if (s) mine.taskDone[tdId] = { ...s, confirmedBy: ME, confirmedByName: mine.player.name };
      }
      commit();
    },
  };
}

async function makeFirebaseDB(cfg, emit) {
  const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = A.initializeApp(cfg);
  const auth = Au.getAuth(app);
  const db = F.getFirestore(app);
  let S = emptyState(); let unsubs = []; let allSubbed = false;
  const fire = () => emit({ ...S });
  const fail = e => { console.error(e); toast(e.code === 'permission-denied' ? 'Keine Berechtigung (Regeln/Zeitfenster).' : 'Fehler: ' + (e.message || e)); };
  function subscribeAll() {
    if (allSubbed) return; allSubbed = true;
    // erst rendern/automatisch handeln, wenn ALLE Daten einmal geladen sind
    const need = new Set(['players', 'weighins', 'habitlogs', 'weekly', 'tasks', 'taskDone', 'private']);
    const got = n => { if (need.delete(n) && need.size === 0) S.synced = true; };
    const col = (name) => unsubs.push(F.onSnapshot(F.collection(db, name), qs => { const o = {}; qs.forEach(d => o[d.id] = d.data()); S[name] = o; if (name === 'players' && !o[S.me] && S.players[S.me]) o[S.me] = S.players[S.me]; got(name); fire(); }, fail));
    ['players', 'weighins', 'habitlogs', 'weekly', 'tasks', 'taskDone'].forEach(col);
    unsubs.push(F.onSnapshot(F.doc(db, 'players', S.me, 'private', 'weights'), s => { S.myWeights = s.exists() ? (s.data().slots || {}) : {}; got('private'); fire(); }, fail));
  }
  Au.onAuthStateChanged(auth, user => {
    unsubs.forEach(u => u()); unsubs = []; allSubbed = false; S = emptyState();
    if (!user) { S.ready = true; fire(); return; }
    S.authed = true; S.me = user.uid; S.displayName = user.displayName || '';
    unsubs.push(F.onSnapshot(F.doc(db, 'players', user.uid), snap => {
      if (snap.exists()) { S.players = { ...S.players, [user.uid]: snap.data() }; S.member = true; subscribeAll(); }
      else S.member = false;
      S.ready = true; fire();
    }, e => { S.ready = true; fail(e); fire(); }));
  });
  const me = () => S.me;
  const wrap = p => p.catch(e => { fail(e); throw e; });
  return {
    demo: false,
    refresh: fire,
    async signIn() { const prov = new Au.GoogleAuthProvider(); try { await Au.signInWithPopup(auth, prov); } catch (e) { if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') await Au.signInWithRedirect(auth, prov); else fail(e); } },
    signOut: () => Au.signOut(auth),
    register: d => F.setDoc(F.doc(db, 'players', me()), { name: d.name, habits: d.habits, joinedSlot: d.joinedSlot, joinedAt: F.serverTimestamp(), invite: d.invite }).catch(e => { if (e.code === 'permission-denied') toast('Einladungscode falsch.'); else fail(e); throw e; }),
    updatePlayer: d => wrap(F.updateDoc(F.doc(db, 'players', me()), d)),
    saveWeigh(slot, kg, lossPct) {
      const b = F.writeBatch(db);
      b.set(F.doc(db, 'weighins', me() + '_' + slot), { uid: me(), slot, lossPct, ts: F.serverTimestamp() });
      b.set(F.doc(db, 'players', me(), 'private', 'weights'), { slots: { [slot]: kg } }, { merge: true });
      return wrap(b.commit());
    },
    setHabit: (day, done) => wrap(F.setDoc(F.doc(db, 'habitlogs', me() + '_' + day), { uid: me(), day, done })),
    setWeekly: (w, text, kind, target) => F.setDoc(F.doc(db, 'weekly', String(w)), { text, kind, target, setBy: me(), setByName: S.players[me()]?.name || '', ts: F.serverTimestamp() }).catch(e => { toast(e.code === 'permission-denied' ? 'Zu spät, jemand anderes war schneller.' : 'Fehler: ' + e.message); throw e; }),
    addTask: (e, text) => wrap(F.setDoc(F.doc(db, 'tasks', 'e' + e + '_' + me()), { etappe: e, text, createdBy: me(), createdByName: S.players[me()]?.name || '', ts: F.serverTimestamp() })),
    deleteTask: id => wrap(F.deleteDoc(F.doc(db, 'tasks', id))),
    markTask: (id, on) => wrap(on ? F.setDoc(F.doc(db, 'taskDone', id + '_' + me()), { uid: me(), taskId: id, confirmedBy: null, confirmedByName: null }) : F.deleteDoc(F.doc(db, 'taskDone', id + '_' + me()))),
    confirmTask: tdId => wrap(F.updateDoc(F.doc(db, 'taskDone', tdId), { confirmedBy: me(), confirmedByName: S.players[me()]?.name || '' })),
  };
}

function onState(ns) {
  S = ns; C = compute(S);
  // Startgewicht verpasst? -> automatisch nächsten Montag starten
  const p = S.players[S.me];
  if (S.member && S.synced && p && !C[S.me]?.active && S.myWeights[p.joinedSlot || 0] === undefined && slotDeadline(p.joinedSlot || 0) <= now() && !bumping) {
    const k = nextJoinSlot();
    if (k !== null && k > (p.joinedSlot || 0)) { bumping = true; DB.updatePlayer({ joinedSlot: k }).finally(() => bumping = false); }
  }
  render();

function render() {
  const a = document.activeElement;

const WEIGH_HINT = 'Morgens, nüchtern, nach dem Klo, gleiche Waage. Foto in die Gruppe. Andere sehen nur deine Prozente.';
function viewHeute() {
  const me = C[S.me]; const p = S.players[S.me];
  if (seasonOver()) {
    const w = rankTotal(C)[0];
    return `<section class="lead"><p class="k">Saison beendet</p>${w ? `<p class="big">${esc(w.name)}</p>
      <p class="s">gewinnt mit ${w.total} Punkten und ${lossStr(w.latest)} seit Start.</p><p class="n">Bekommt den Topf: ${eur(pot(C).total)}.</p>` : ''}</section>` + viewRanking();
  }
  // oben steht genau eine Sache in Akzentfarbe: Wiegen (wenn fällig) oder der Wochenstand
  const lead = weighLead(me, p);
  return (lead || standingLead(me)) + (lead ? '' : weighCard(me, p)) + habitsCard(me, p) + weeklyCard(me);
}
function weighInput(slot, label, val, primary) {
  return `<div class="row"><input class="inp grow" id="kg" type="number" inputmode="decimal" step="0.1" min="30" max="300" placeholder="kg" aria-label="Gewicht in kg" value="${val ?? ''}"><button class="btn${primary ? '' : ' ghost'}" data-act="weigh" data-slot="${slot}">${label}</button></div>`;
}
function weighLead(me, p) {
  const js = p.joinedSlot || 0; const os = openSlot();
  if (!me.active) {
    if (os === js) return `<section class="lead"><p class="k">Startgewicht · offen bis ${CONFIG.deadlineHour}:00 Uhr</p>
      <p class="big cd">${countdown(slotDeadline(js))} <span>übrig</span></p>
      ${weighInput(js, 'Speichern', '', true)}<p class="n">${WEIGH_HINT}</p></section>`;
    return `<section class="lead"><p class="k">Startgewicht am ${fmtD(slotStart(js))}, 0–${CONFIG.deadlineHour} Uhr</p>
      <p class="big cd">in ${countdown(slotStart(js))}</p><p class="n">${WEIGH_HINT}</p></section>`;
  }
  if (os === null || os <= js || me.wb[os] !== undefined) return '';
  return `<section class="lead"><p class="k">Wiegen für Woche ${os} · offen bis ${CONFIG.deadlineHour}:00 Uhr</p>
    <p class="big cd">${countdown(slotDeadline(os))} <span>übrig</span></p>
    ${weighInput(os, 'Eintragen', '', true)}<p class="n">${WEIGH_HINT} Verpasst = 0 Waage-Punkte und ${eur(CONFIG.strafe)} in den Topf.</p></section>`;
}
function standingLead(me) {
  const cw = curWeek(); if (!me.active || cw < 1 || cw > CONFIG.weeks) return '';
  let w = cw;
  if (dayIdx() === 7 * (cw - 1) && cw - 1 > me.js) w = cw - 1; // Montag: Ergebnis der Vorwoche
  const r = rankWeek(C, w); const mine = r.find(x => x.uid === S.me); if (!mine) return '';
  const names = xs => andJoin(xs.map(x => esc(x.name)));
  const others = r.filter(x => x.uid !== S.me);
  const above = others.filter(x => x.total > mine.total), below = others.filter(x => x.total < mine.total), tied = others.filter(x => x.total === mine.total);

const CH = { W: 600, H: 340, L: 62, R: 90, T: 18, B: 40 };

  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line x1="${CH.L}" x2="${CH.W - CH.R}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v) < 1e-9 ? '#55554f' : '#2a2a27'}" stroke-width="1"/><text x="${CH.L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="18" fill="#8c8b83">${Math.abs(v) < 1e-9 ? '0' : (v > 0 ? '−' : '+') + fmt1(Math.abs(v)).replace(',0', '')}</text>`;
  const xstep = maxS > 12 ? 4 : maxS > 6 ? 2 : 1;
  for (let k = 0; k <= maxS; k += xstep) g += `<text x="${x(k)}" y="${CH.H - 10}" text-anchor="middle" font-size="18" fill="#8c8b83">${k === 0 ? 'Start' : 'W' + k}</text>`;
  let lines = '', labels = [];
  for (const p of players) {
    const pts = Object.keys(p.wb).map(Number).sort((a, b) => a - b);
    lines += `<polyline fill="none" stroke="${p.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(k => `${x(k)},${y(p.wb[k])}`).join(' ')}"/>`;
    lines += pts.map(k => `<circle cx="${x(k)}" cy="${y(p.wb[k])}" r="5" fill="${p.color}" stroke="#1a1a19" stroke-width="2"/>`).join('');
    const lk = pts[pts.length - 1]; labels.push({ y: y(p.wb[lk]), x: x(lk), name: p.name, color: p.color });
  }
  let dl = '';
  if (players.length <= 4) {
    labels.sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 22) labels[i].y = labels[i - 1].y + 22;
    dl = labels.map(l => `<text x="${l.x + 10}" y="${l.y + 6}" font-size="19" font-weight="700" fill="#c3c2b7">${esc(l.name)}</text>`).join('');
  }
  return `<svg viewBox="0 0 ${CH.W} ${CH.H}" role="img" aria-label="Abnahme in Prozent pro Woche">${g}<line id="xh" y1="${CH.T}" y2="${CH.H - CH.B}" stroke="#8c8b83" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>${lines}${dl}<rect id="hit" x="${CH.L}" y="0" width="${CH.W - CH.L - CH.R + 20}" height="${CH.H}" fill="transparent"/></svg>`;
}
function wireChart() {
  const box = document.getElementById('chart'); if (!box) return;
  const svg = box.querySelector('svg'), tip = document.getElementById('tip'), xh = svg.querySelector('#xh');
  const move = ev => {
    const r = svg.getBoundingClientRect(); const sx = (ev.clientX - r.left) * CH.W / r.width;
    const k = clamp(Math.round((sx - CH.L) / ((CH.W - CH.L - CH.R) / CH.maxS)), 0, CH.maxS);
    const rows = CH.players.filter(p => p.wb[k] !== undefined).sort((a, b) => b.wb[k] - a.wb[k]);
    if (!rows.length) { tip.style.display = 'none'; xh.style.display = 'none'; return; }
    xh.setAttribute('x1', CH.x(k)); xh.setAttribute('x2', CH.x(k)); xh.style.display = '';
    tip.innerHTML = `<div class="muted" style="margin-bottom:4px">${k === 0 ? 'Start' : 'Woche ' + k} · ${fmtD(slotStart(k))}</div>` + rows.map(p => `<div class="tr"><span class="row" style="gap:6px"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</span><b>${lossStr(p.wb[k])}</b></div>`).join('');
    tip.style.display = 'block';
    const px = CH.x(k) * r.width / CH.W; const tw = tip.offsetWidth;
    tip.style.left = (px + 12 + tw > r.width ? px - tw - 12 : px + 12) + 'px'; tip.style.top = '8px';
  };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.style.display = 'none'; });
}

/* ---------- REGELN ---------- */
function viewRegeln() {
  const end = dayDate(CONFIG.weeks * 7 - 1);
  const wMax = CONFIG.weighMaxTenths * CONFIG.weighPerTenth;
  return `<div class="card rules"><h2>Regeln</h2>
  <p><b>${CONFIG.weeks} Wochen</b> (${fmtD(START)} bis ${fmtD(end)}${end.getFullYear()}), aufgeteilt in <b>${NUM_ETAPPEN} Etappen</b> à ${CONFIG.etappeWeeks} Wochen. Alles wird in <b>Prozent vom eigenen Startgewicht</b> gerechnet, damit es für jede Größe fair ist.</p>
  <h3>Wiegen (max. ${wMax} P./Woche)</h3><ul>
   <li>Jeden <b>Montag 0–${CONFIG.deadlineHour} Uhr</b>: morgens, nüchtern, nach dem Klo, gleiche Waage. Foto in die Gruppe.</li>
   <li><b>${CONFIG.weighPerTenth} Punkte pro 0,1 %</b> unter deinem bisherigen Tiefstwert, maximal ${wMax} Punkte (= ${fmt1(CONFIG.weighMaxTenths / 10)} %) pro Woche. Mehr bringt nichts, Crash-Diäten lohnen sich also nicht.</li>
   <li>Zunehmen kostet keine Punkte. Waage-Punkte gibt's aber erst wieder, wenn du unter deinem alten Tiefstwert bist.</li>
   <li>Verpasst = 0 Waage-Punkte + <b>${eur(CONFIG.strafe)}</b> in den Topf.</li></ul>
  <h3>Gewohnheiten (max. 21 P./Woche)</h3><ul>
   <li>Jeder wählt <b>3 eigene</b>. 1 Punkt pro Gewohnheit und Tag, bis zu ${CONFIG.backfillDays} Tage nachtragen (auch in die Vorwoche).</li>
   <li>Ändern nur vor dem Start und in der 1. Woche jeder Etappe. Zu leichte Gewohnheiten darf die Gruppe ablehnen.</li></ul>
  <h3>Wochen-Challenge (max. ${CONFIG.challengePts} P.)</h3><ul>
   <li>Montag nach dem Wiegen hat der <b>Wochenletzte ${CONFIG.chooseHours} Std. Zeit</b>, die Challenge zu wählen. Danach darf jeder, wer zuerst kommt, entscheidet.</li>
   <li>Täglich (1 Punkt pro Tag, max. ${CONFIG.challengePts}, ein Tag Puffer) oder 1–2× pro Woche (${CONFIG.challengePts} bzw. je ${Math.round(CONFIG.challengePts / 2)} Punkte). Abhaken wie eine Gewohnheit.</li></ul>
  <h3>Extra-Aufgaben (+${CONFIG.taskPts} P. pro Aufgabe)</h3><ul>
   <li><b>Jeder stellt 1 Komfortzonen-Aufgabe pro Etappe</b> (z. B. 2× 5 km laufen, 1 h schwimmen). Je mehr Leute, desto mehr Aufgaben. Alle dürfen jede Aufgabe machen.</li>
   <li>Zählt erst, wenn <b>jemand anderes bestätigt</b>. Beweis in die Gruppe.</li></ul>
  <h3>Topf</h3><ul>
   <li>${eur(CONFIG.einsatz)} Einsatz (einmalig) + ${eur(CONFIG.strafe)} pro verpasstem Wiegen + <b>${eur(CONFIG.loserFee)} für den Letzten jeder Woche</b> (nur wenn nicht alle gleich viele Punkte haben).</li>
   <li>Wer was zahlt, steht unter Ranking → Kasse, aufgeteilt nach Etappe. Der <b>Gesamtsieger</b> nach Woche ${CONFIG.weeks} kassiert alles.</li>
   <li>Neue Leute können jederzeit einsteigen und starten am nächsten Montag. Für Spätstarter ist die Etappenwertung die faire Chance.</li></ul></div>`;
}
/* ---------- PROFIL-MODAL ---------- */
function renderModal() {
  const m = document.getElementById('modal');
  if (UI.modal !== 'profile' || !S.member) { m.innerHTML = ''; return; }
  const p = S.players[S.me]; const he = habitsEditable();
  const code = p.invite && !DEMO ? `<p class="small t2">Einladungscode für neue Leute: <b>${esc(p.invite)}</b>. Schick ihnen den Link und den Code.</p>` : '';
  m.innerHTML = `<div class="modal" data-act="closeModal"><div class="sheet" data-stop>
    <div class="row"><h2 class="grow">Profil</h2><button class="btn ghost sm" data-act="closeModal" aria-label="Schließen">✕</button></div>
    <label class="f" for="pName">Name</label><input class="inp" id="pName" maxlength="20" value="${esc(p.name)}">
    <label class="f">Gewohnheiten ${he ? '' : '<span class="muted">(gesperrt bis zur 1. Woche der nächsten Etappe)</span>'}</label>
    <div class="stack">${[0, 1, 2].map(i => `<input class="inp" id="pH${i}" maxlength="40" value="${esc(p.habits?.[i] || '')}" ${he ? '' : 'disabled'} aria-label="Gewohnheit ${i + 1}">`).join('')}</div>
    ${code}
    <button class="btn full" data-act="saveProfile">Speichern</button>
    ${DEMO ? '' : `<button class="link" data-act="signout">Abmelden</button>`}</div></div>`;
}

/* ---------- EVENTS ---------- */
const val = id => (document.getElementById(id)?.value || '').trim();
document.addEventListener('click', async ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { UI.tab = tab.dataset.tab; window.scrollTo(0, 0); render(); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'closeModal' && ev.target.closest('[data-stop]') && el.classList.contains('modal')) return;
  const a = el.dataset.act;
  try {
    switch (a) {
      case 'signin': await DB.signIn(); break;
      case 'signout': UI.modal = null; await DB.signOut(); break;
      case 'register': {
        const name = val('rName'), habits = [val('rH0'), val('rH1'), val('rH2')];
        if (!name) return toast('Name fehlt.');
        if (habits.some(h => !h)) return toast('Bitte alle 3 Gewohnheiten eintragen.');
        const k = nextJoinSlot(); if (k === null) return;
        await DB.register({ name, habits, joinedSlot: k, invite: DEMO ? 'DEMO' : val('rCode') });
        toast(`Dabei. Startgewicht am ${fmtD(slotStart(k))} bis ${CONFIG.deadlineHour} Uhr eintragen.`); break;
      }
      case 'weigh': {
        const slot = +el.dataset.slot; const kg = parseFloat(val('kg').replace(',', '.'));
        if (!(kg >= 30 && kg <= 300)) return toast('Bitte ein gültiges Gewicht eingeben.');
        const p = S.players[S.me]; const js = p.joinedSlot || 0;
        let loss = 0;
        if (slot !== js) { const st = S.myWeights[js]; if (!st) return toast('Startgewicht fehlt.'); loss = Math.round((st - kg) / st * 10000) / 100; }
        document.activeElement?.blur();
        await DB.saveWeigh(slot, Math.round(kg * 10) / 10, loss);
        toast(slot === js ? 'Startgewicht gespeichert.' : `Gespeichert: ${lossStr(loss)} seit Start`); break;
      }
      case 'habit': {
        const d = +el.dataset.day, i = +el.dataset.h; const cur = (C[S.me].hl[d] || []).slice(0, 4).map(Boolean);
        while (cur.length < 4) cur.push(false); cur[i] = !cur[i]; await DB.setHabit(d, cur); break;
      }
      case 'hw': {
        const cur = Math.min(curWeek(), CONFIG.weeks); const minW = Math.min(cur, Math.max(1, (S.players[S.me]?.joinedSlot || 0) + 1));
        UI.habitWeek = clamp((UI.habitWeek ?? cur) + +el.dataset.d, minW, cur); if (UI.habitWeek === cur) UI.habitWeek = null; render(); break;
      }
      case 'setWeekly': {
        const t = val('wText'); if (!t) return toast('Text fehlt.');
        const k = document.getElementById('wKind')?.value || 'daily';
        document.activeElement?.blur();
        await DB.setWeekly(+el.dataset.w, t, k === 'daily' ? 'daily' : 'count', k === 'daily' ? 7 : +k); toast('Challenge gespeichert.'); break;
      }
      case 'addTask': { const t = val('tText'); if (!t) return toast('Text fehlt.'); document.activeElement?.blur(); await DB.addTask(+el.dataset.e, t); break; }
      case 'delTask': await DB.deleteTask(el.dataset.id); break;
      case 'mark': await DB.markTask(el.dataset.id, el.dataset.on === '1'); break;
      case 'confirm': await DB.confirmTask(el.dataset.id); toast('Bestätigt.'); break;
      case 'rmode': UI.rankMode = el.dataset.m; render(); break;
      case 'rw': UI.rankWeek = clamp(UI.rankWeek + +el.dataset.d, 1, CONFIG.weeks); render(); break;
      case 're': UI.rankEtappe = clamp(UI.rankEtappe + +el.dataset.d, 1, NUM_ETAPPEN); render(); break;
      case 'ev': UI.etView = clamp(UI.etView + +el.dataset.d, 1, NUM_ETAPPEN); render(); break;
      case 'ctab': UI.chartTable = !UI.chartTable; render(); break;
      case 'profile': UI.modal = 'profile'; renderModal(); break;
      case 'closeModal': UI.modal = null; renderModal(); break;
      case 'saveProfile': {
        const name = val('pName'); if (!name) return toast('Name fehlt.');
        const d = { name }; if (habitsEditable()) { const hs = [val('pH0'), val('pH1'), val('pH2')]; if (hs.some(h => !h)) return toast('3 Gewohnheiten nötig.'); d.habits = hs; }
        document.activeElement?.blur(); await DB.updatePlayer(d); UI.modal = null; renderModal(); toast('Gespeichert'); break;
      }
      case 'demoReset': DB.reset(); UI.rankWeek = UI.rankEtappe = UI.etView = UI.habitWeek = null; break;
      case 'demoMon': { const d = dayIdx(); const k = Math.max(0, Math.floor(d / 7) + 1); const t = slotStart(Math.min(k, CONFIG.weeks)); t.setHours(9); setNow(t); break; }
    }
  } catch (e) { /* Fehler wurde schon angezeigt */ }
});
document.addEventListener('change', ev => { if (ev.target.id === 'demoTime' && ev.target.value) setNow(new Date(ev.target.value)); });
function setNow(t) { NOW_OVERRIDE = t.getTime(); LS.setItem('cdf-demo-now', String(NOW_OVERRIDE)); UI.rankWeek = UI.rankEtappe = UI.etView = UI.habitWeek = null; DB.refresh(); }
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.matches('#app input') && ev.target.parentElement.classList.contains('row')) { const b = ev.target.parentElement.querySelector('.btn') || null; if (b) b.click(); } });

/* ---------- START ---------- */
(async function init() {
  if (DEMO) {
    const q = new URLSearchParams(location.search).get('now');
    const stored = +LS.getItem('cdf-demo-now');
    if (q) NOW_OVERRIDE = new Date(q).getTime();
    else if (stored) NOW_OVERRIDE = stored;
    else { const t = dayDate(14); t.setHours(9); NOW_OVERRIDE = Math.max(Date.now(), t.getTime()); }
    DB = makeDemoDB(onState);
  } else {
    const q = new URLSearchParams(location.search).get('now');
    if (CONFIG.testMode && q) NOW_OVERRIDE = new Date(q).getTime();
    try { DB = await makeFirebaseDB(CONFIG.firebase, onState); }
    catch (e) { console.error(e); document.getElementById('app').innerHTML = `<div class="card"><h2>Verbindung fehlgeschlagen</h2><p class="t2">Firebase konnte nicht geladen werden. Prüf die Config in der index.html.</p></div>`; }
  }
  setInterval(() => { if (S.ready && !UI.modal) render(); }, 60000);
})();
</script>
